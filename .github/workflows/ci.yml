name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Case queries and some docstrings are Chinese; without this, stdout on the Windows
# runners is cp1252 and printing them raises UnicodeEncodeError.
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests eval demo

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Offline evaluation (tag compiler)
        run: python eval/run_eval.py

      - name: End-to-end demo over stdio
        run: python demo/story.py

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t aninest-mcp:ci .
      - name: Smoke test (imports + tool registry)
        run: |
          docker run --rm --entrypoint python aninest-mcp:ci -c "import asyncio; from aninest.server import mcp; names = sorted(t.name for t in asyncio.run(mcp.list_tools())); from aninest.server import EXPECTED_TOOLS; assert names == sorted(EXPECTED_TOOLS), names; print('tools:', names)"
