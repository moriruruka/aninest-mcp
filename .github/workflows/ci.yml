name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests eval

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Offline evaluation (tag compiler)
        run: python eval/run_eval.py

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aninest-mcp:ci .
      - name: Smoke test (imports + tool registry)
        run: |
          docker run --rm aninest-mcp:ci python - <<'PY'
          import asyncio
          from aninest.server import mcp
          tools = asyncio.run(mcp.list_tools())
          names = sorted(t.name for t in tools)
          assert names == ["arena_lookup", "art_search", "memory_search", "memory_stats", "service_health"], names
          print("tools:", names)
          PY
