[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aninest-mcp"
version = "0.2.0"
description = "AniNest: an MCP server that nests an ACG-loving assistant's local capabilities (illustration search, game cheat-sheet lookup, memory retrieval, service health) behind five tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "moriruruka" }]
keywords = ["mcp", "llm", "agent", "tool-use", "rag", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  # mcp 2.x renamed FastMCP to MCPServer and changed the tool API; this project
  # targets the 1.x surface, so the upper bound is deliberate, not laziness.
  "mcp>=1.20,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/moriruruka/aninest-mcp"
Issues = "https://github.com/moriruruka/aninest-mcp/issues"

[project.scripts]
aninest-mcp = "aninest.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aninest"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "eval", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# Generated by scripts/port_tags.py from the assistant's own table; kept verbatim so a
# diff against the source stays readable (reformatting by hand would hide drift).
"src/aninest/_tag_tables.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
